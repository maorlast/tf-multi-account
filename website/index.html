<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tf-multi-account</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { text-align: center; padding: 2rem; }
    .badge {
      display: inline-block;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 9999px;
      padding: 0.25rem 1rem;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    h1 { font-size: 3rem; font-weight: 700; margin-bottom: 1rem; }
    h1 span { color: #6366f1; }
    p { color: #94a3b8; font-size: 1.125rem; max-width: 480px; margin: 0 auto 2rem; }
    .env {
      display: inline-block;
      background: #16a34a22;
      border: 1px solid #16a34a;
      color: #4ade80;
      border-radius: 0.375rem;
      padding: 0.375rem 0.875rem;
      font-size: 0.875rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Terraform · AWS S3</div>
    <h1>Hello from <span>tf-multi-account</span></h1>
    <p>This static site was provisioned and deployed automatically using Terraform.</p>
    <span class="env">Environment: dev</span>
    <p style="margin-top: 2rem; font-size: 0.875rem; color: #475569;">Created by Maor Last</p>
  </div>
</body>
</html>
