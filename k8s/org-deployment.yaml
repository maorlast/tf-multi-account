apiVersion: apps/v1
kind: Deployment
metadata:
  name: org-service
  namespace: pod-info
spec:
  replicas: 2
  selector:
    matchLabels:
      app: org-service
  template:
    metadata:
      labels:
        app: org-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: org-service
          image: 405903923186.dkr.ecr.us-east-1.amazonaws.com/tf-multi-account-dev-org-pod-info:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_DB
              value: clickdb
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
