apiVersion: apps/v1
kind: Deployment
metadata:
  name: org-service
  namespace: pod-info
spec:
  replicas: 2
  selector:
    matchLabels:
      app: org-service
  template:
    metadata:
      labels:
        app: org-service
    spec:
      containers:
        - name: org-service
          image: 405903923186.dkr.ecr.us-east-1.amazonaws.com/tf-multi-account-dev-org-pod-info:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP   # K8s injects the node's IP at runtime
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
