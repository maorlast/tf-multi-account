apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pod-info
  namespace: pod-info
  annotations:
    kubernetes.io/ingress.class: alb                        # use AWS ALB instead of nginx
    alb.ingress.kubernetes.io/scheme: internet-facing       # public ALB (vs internal)
    alb.ingress.kubernetes.io/target-type: ip               # route directly to pod IPs (not node)
    alb.ingress.kubernetes.io/healthcheck-path: /health     # ALB health check endpoint
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pod-info
                port:
                  number: 80
